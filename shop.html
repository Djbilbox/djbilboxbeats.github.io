<html lang="en">
<head>

</head>
<body data-page="shop">


<!-- ============ SHOP TAB SWITCHER ============ -->
<div class="subnav">
  <div class="subnav-inner" id="shopTabs">
    <!-- Une seule grille, filtree par ces pastilles — le « ALL SAUCE »
         d'Apeshyt. Tout est visible d'entree, rien n'est empile par
         sections : c'est ce que bil demandait des deux cotes. -->
    <button class="pill active" data-filter="all">🛍️ All</button>
    <button class="pill" data-filter="bundles">🎁 Bundles</button>
    <button class="pill" data-filter="synths">🎹 Synths</button>
    <button class="pill" data-filter="effects">⚙️ Effects</button>
    <button class="pill" data-filter="free">✅ Free</button>
    <button class="pill" data-filter="kits">🥁 Drum Kits</button>
  </div>
</div>

<!-- ============ SEARCH & SORT ============ -->
<div class="filter-bar">
  <div class="container">
    <div class="filter-controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Search products..." />
      <select id="sortSelect" class="sort-select">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A-Z</option>
        <option value="name-desc">Name: Z-A</option>
      </select>
    </div>
  </div>
</div>

<main class="container" style="padding-top:18px">
  <div class="shop-count" id="shopCount"></div>
  <div class="grid" id="shopGrid" style="margin-bottom:60px"></div>
</main>

<!-- ============ FOOTER ============ -->
<!-- footer injected by mountFooter() in assets/js/site.js -->

<!-- Summer sale ended 30 July 2026 — no banner here, so mountPromo() in site.js
     falls back to the evergreen "931 Beats Free" bar. -->

<!-- ============ SCRIPTS ============ -->
<script src="assets/js/vst-data.js?v=26081360"></script>
<script src="assets/js/packs-data.js?v=26081360"></script>
<script src="assets/js/pricing.js?v=26081360"></script>
<script src="assets/js/site.js?v=26081360"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="assets/js/modern-animations.js?v=26071803" defer></script>
<script>
  /* Boutique DJBILBOX — une grille, des pastilles.
     N'affiche QUE les articles du store Gumroad DJBILBOX BEATS : le materiel
     partenaire et les VST d'autres editeurs en ont ete retires le 12 aout 2026
     (leurs fiches dediees existent toujours). */
  const grid  = document.getElementById('shopGrid');
  const count = document.getElementById('shopCount');
  const tabs  = document.getElementById('shopTabs');
  let filter = 'all', sortMode = 'featured', searchTerm = '';

  const isMine = v => v.category !== 'partner' && v.category !== 'free' && !v.url;
  /* Un produit peut appartenir a plusieurs rubriques : un synthe gratuit est
     un SYNTH *et* un FREE. Sinon les versions BASIC disparaissaient de SYNTHS
     et l'onglet ne montrait que les payants. */
  const familles = v => {
    const f = [];
    /* STATION SYNTH PRO BUNDLE et ORIENTAL PRO BUNDLE sont des bundles ET des
       synthetiseurs : le bundle, c'est le synthe avec ses extensions. Seul le
       PRO BUNDLE global (6 plugins) n'est pas un instrument en soi. */
    if(v.tier === 'bundle')                                  f.push('bundles');
    else if(v.tier === 'legendary' || v.tier === 'oriental')  f.push('bundles','synths');
    else if(v.category === 'effect')                          f.push('effects');
    else                                                      f.push('synths');
    if(v.free) f.push('free');
    return f;
  };
  const famille = v => familles(v)[0];

  function parsePrice(v){
    if(v && (v.free || String(v.price).toUpperCase()==='FREE')) return 0;
    return parseFloat(String(v.price).replace(/[^0-9.]/g,'')) || 0;
  }
  function matchSearch(v){
    if(!searchTerm) return true;
    const q = searchTerm.toLowerCase();
    return (v.name||'').toLowerCase().includes(q)
        || (v.tags||[]).some(t => t.toLowerCase().includes(q));
  }
  function sortFn(a,b){
    if(sortMode==='price-asc')  return parsePrice(a) - parsePrice(b);
    if(sortMode==='price-desc') return parsePrice(b) - parsePrice(a);
    if(sortMode==='name-asc')   return (a.name||'').localeCompare(b.name||'');
    if(sortMode==='name-desc')  return (b.name||'').localeCompare(a.name||'');
    return 0;
  }

  function render(){
    grid.innerHTML = '';
    /* Ordre par defaut : bundles, synthes, effets, gratuits, puis les kits —
       du plus cher au plus accessible, comme sa page. */
    const rang = { bundles:0, synths:1, effects:2, free:3 };
    let vsts = (window.VSTS||[]).filter(isMine).filter(matchSearch)
                 .filter(v => filter==='all' || familles(v).includes(filter));
    vsts = sortMode==='featured'
      ? vsts.sort((a,b)=>rang[famille(a)]-rang[famille(b)])
      : vsts.sort(sortFn);

    let packs = (filter==='all' || filter==='kits')
      ? (window.PACKS||[]).filter(matchSearch) : [];
    if(sortMode!=='featured') packs = packs.slice().sort(sortFn);

    const frag = document.createDocumentFragment();
    vsts.forEach(v => frag.appendChild(vstCard(v)));
    packs.forEach(p => frag.appendChild(packCard(p)));
    grid.appendChild(frag);

    const n = vsts.length + packs.length;
    count.textContent = n + (n>1 ? ' produits' : ' produit');
    if(!n) grid.innerHTML = '<p class="empty">Aucun produit ici.</p>';
  }

  tabs.addEventListener('click', e => {
    const b = e.target.closest('.pill');
    if(!b) return;
    filter = b.dataset.filter;
    tabs.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p===b));
    history.replaceState(null, '', filter==='all' ? location.pathname : '#'+filter);
    render();
  });

  /* Les entrees de la barre du haut pointent vers shop.html#<rubrique>. */
  function fromHash(){
    /* `#plugins` est l'ancien nom de la rubrique : on le fait suivre vers
       `#synths` pour ne pas casser les liens deja partages. */
    const alias = { plugins:'synths', 'drum-kits':'kits' };
    let w = location.hash.replace('#','');
    w = alias[w] || w;
    const b = tabs.querySelector('.pill[data-filter="'+w+'"]') || tabs.querySelector('.pill');
    filter = b.dataset.filter;
    tabs.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p===b));
    render();
  }
  window.addEventListener('hashchange', fromHash);

  document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; render(); });
  document.getElementById('sortSelect').addEventListener('change', e => { sortMode = e.target.value; render(); });
  fromHash();
</script>
</body>
</html>
